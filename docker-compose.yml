services:
  monitor:
    build: .
    restart: unless-stopped
    ports:
      - "8473:8473"
    environment:
      - PORT=8473
      - DB_PATH=/app/data/monitor.db
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - monitor-data:/app/data

volumes:
  monitor-data:
